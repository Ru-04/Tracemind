[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracemind"
version = "0.0.0"
description = "Evidence-driven observability and AI-assisted incident investigation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn>=0.30",
    "pydantic>=2.14",
    "sqlalchemy>=2.1",
    "psycopg[binary]>=3.3",
    "alembic>=1.20",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "ruff>=0.17",
    "mypy>=2.4",
    "jsonschema[format]>=4",
    "types-jsonschema",
    "pip-audit>=2.10",
]

[tool.setuptools.packages.find]
where = ["backend", "."]
include = ["tracemind*", "demo_app*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the PostgreSQL test database (see infra/docker-compose.yml)",
    "graphify: needs the pinned Graphify CLI (python -m tools.install_graphify)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/tracemind/storage/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # long fixture literals read better unwrapped

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
explicit_package_bases = true
files = ["backend/tracemind", "demo_app", "tools", "tests"]
exclude = ["backend/tracemind/storage/migrations/versions"]
